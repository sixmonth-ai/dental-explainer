<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Root filling, post, core, crown</title></head>
<body>
<script>window.DK_MODE = 'interactive'; window.DK_ASPECT = '16:9';</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* dentkit.js — drawing kit for interactive dental figures (three.js r128, global THREE).

(function () {
  const T = THREE;

  DK.color = hex => new T.Color(hex).convertSRGBToLinear();

  DK.COLORS = {

    titanium: 0xb1b3b5, titaniumDark: 0x85888c, zirconia: 0xf2f0ea, ceramic: 0xf1efe8,
    gold: 0xcbb27c, steel: 0xc4c6c8, nickelTi: 0xa3a6a9, gutta: 0xc8977c, composite: 0xe7e1d3, rubberDam: 0x5b7f9a, caries: 0x7a6554,
    accent: 0x0E3A5C, accentDark: 0x5A8FB8

    enamel: { color: 'enamel', roughness: 0.3, metalness: 0, clearcoat: 0.7, rim: [0.80, 0.86, 0.95, 0.45], core: [1.0, 0.965, 0.9, 0.45], bump: 'perikymata', bumpScale: 0.005 },

    root: { color: 'cementum', roughness: 0.68, bump: 'streaks', bumpScale: 0.03, map: 'streaks' },
    pulp: { color: 'pulp', roughness: 0.5 },
    gingiva: { color: 'gingiva', roughness: 0.42, clearcoat: 0.3, bump: 'stipple', bumpScale: 0.02, core: [1.0, 0.93, 0.92, 0.22] },
    bone: { color: 'cortical', roughness: 0.74, bump: 'pores', bumpScale: 0.05, map: 'pores' },
    titanium: { color: 'titanium', roughness: 0.32, metalness: 0.85 },
    titaniumDark: { color: 'titaniumDark', roughness: 0.35, metalness: 0.85 },
    gold: { color: 'gold', roughness: 0.3, metalness: 0.9 },
    steel: { color: 'steel', roughness: 0.25, metalness: 0.9 },
    zirconia: { color: 'zirconia', roughness: 0.3, clearcoat: 0.5, rim: [0.9, 0.92, 0.96, 0.2] },
    ceramic: { color: 'ceramic', roughness: 0.3, clearcoat: 0.5, rim: [0.9, 0.92, 0.96, 0.2] },   // same program as zirconia
    nerve: { color: 'nerve', roughness: 0.5 },
    artery: { color: 'artery', roughness: 0.45 },
    vein: { color: 'vein', roughness: 0.45 },
    pdl: { color: 'pdl', roughness: 0.6 },
    gutta: { color: 'gutta', roughness: 0.5 },
    composite: { color: 'composite', roughness: 0.35 },
    caries: { color: 'caries', roughness: 0.8 },
    rubberDam: { color: 'rubberDam', roughness: 0.5 },
    fiber: { color: 0xe9e5da, roughness: 0.35 },

  /* Procedural textures (no image files). All tileable. */
  const TEX = {};
  const seeded = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };

      const f = noiseField(N, 48, 3, seeded(21), 2, 0.5), c = noiseField(N, 6, 6, seeded(22), 2);
      t = dataTexture(N, (i, px) => { const v = 0.5 + (f[i] - 0.5) * 0.7 + (c[i] - 0.5) * 0.4; px[0] = px[1] = px[2] = N8(v); }, { repeat: [3, 1] });

      const f = noiseField(N, 3, 48, seeded(31), 2), c = noiseField(N, 8, 8, seeded(32), 2);
      t = dataTexture(N, (i, px) => { const v = 0.5 + (f[i] - 0.5) * 0.35 + (c[i] - 0.5) * 0.65; px[0] = px[1] = px[2] = N8(v); }, { repeat: [4, 1] });

  DK.mat = function (name, extra) {

    const Mat = p.clearcoat ? T.MeshPhysicalMaterial : T.MeshStandardMaterial;
    const m = new Mat({ color: DK.color(c), roughness: p.roughness ?? 0.5, metalness: p.metalness ?? 0, ...(p.clearcoat ? { clearcoat: p.clearcoat, clearcoatRoughness: 0.35 } : {}),

    m.userData.capColor = p.cap !== undefined ? p.cap : c;

      const v4 = a => a.map(x => x.toFixed(3)).join(',');

        `{ float fr = 1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0); ${code} }\n#include <dithering_fragment>`); };

  function gridGeometry(rows, cols, fn, closeTop, closeBottom) {

    // so the surface carries seamless UVs (u around, v along); the seam normals are averaged afterwards.
    const pos = [], uv = [], idx = [], W = cols + 1;

    const at = (i, j) => i * W + j;

      const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
      idx.push(a, b, d, b, c, d);
    }

      const ci = pos.length / 3; pos.push(...pt); uv.push(0.5, row ? 1 : 0);
      for (let j = 0; j < cols; j++) { const a = at(row, j), b = at(row, j + 1); flip ? idx.push(ci, b, a) : idx.push(ci, a, b); }
    };

    if (closeTop) addCap(rows, closeTop, true);

    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));

    g.computeVertexNormals();

  const se = (v, n) => Math.sign(v) * Math.pow(Math.abs(v), 2 / n); // superellipse component

  DK.lathe = function (profile, segments, mat) { // profile: [[r,y],...] bottom→top
    const g = new T.LatheGeometry(profile.map(p => new T.Vector2(p[0], p[1])), segments || 48);
    g.computeVertexNormals();

  };
  DK.tube = function (points, radius, mat, opts) {

  /* ---------- threaded bodies (implants, screws) ---------- */
  // Helical thread on a core. y from 0 (top) to -length.

    const L = o.length, rc = o.coreRadius, d = o.threadDepth, p = o.pitch, starts = o.starts || 1;
    const collar = o.collar ?? 0.8, apexTaper = o.apexTaper ?? 0.3, taper = o.bodyTaper ?? 0;

<script>
// Example: root-filled mandibular right second premolar (FDI 45 = Universal 29) restored with gutta-percha, fibre post,
// composite core and a crown wrapping a 2 mm ferrule. Tooth frame: +x mesial, +z buccal, CEJ (= crown margin) at y = 0.
const FDI = 45, FERRULE = 2.0, POST_IN_ROOT = 8, GP_SEAL_MIN = 4;
const spec = DK.toothPreset(FDI);
const fig = DK.figure({
  title: 'Root filling, post, core, crown',
  subtitle: 'FDI 45 (Universal 29), lower right second premolar.',
  view: { theta: 0.5, phi: 1.3 }
});

const tooth = DK.tooth(spec, { omit: ['enamel', 'dentin', 'pulp'] });   // root only: crown already lost
const s = tooth.spec;
const ferrule = DK.prep(s, { maxY: FERRULE });                            // own dentin collar above the margin
const core = DK.prep(s, { material: 'composite', minY: FERRULE });
core.material.color.copy(DK.color(0xc9d2d8));   // composite tinted grey-blue for contrast (say so in the hover text)
const workingLen = s.rootL - 0.5;
const gpTop = -POST_IN_ROOT - 0.2;
const gp = DK.guttaPercha(s, 0, { from: gpTop });
const post = DK.post({ length: POST_IN_ROOT, exposed: 4.5, d0: 1.5, d1: 1.0 });
const crown = DK.restorationCrown(s, 'ceramic');
const bone = DK.bone({ width: 16, height: 19, depth: 11, crest: 1.5 }); bone.position.y = -1.8;
const gum = DK.gingiva({ width: 16, height: 3.2, depth: 11.6, crest: 1.2, around: [{ x: 0, z: 0, md: s.mdC, bl: s.blC, rise: 0.8 }] }); gum.position.y = 1.2;

fig.part(bone, { name: 'Bone', anchor: [7.8, -8, 3], explode: [0, -12, 0], info: 'Alveolar bone around the root.' });
fig.part(gum, { name: 'Gingiva', anchor: [-7.6, 0.4, 5.6], explode: [0, -12, 0], info: 'Soft tissue; the crown margin sits at or just below the gum line.' });
fig.part(tooth.group, { name: 'Your root', sub: '1 root, 1 canal', anchor: [2.4, -7, 0], info: 'The patient’s own root stays in the bone. Lower second premolars usually have one root; about a quarter have two or more canals.' });
fig.part(ferrule, { name: 'Ferrule', sub: `${FERRULE} mm of own tooth`, anchor: [3, 1, 0], accent: true, info: 'A 1.5–2 mm high, ~1 mm thick collar of sound dentin that the crown wraps. It improves fracture resistance more than any post.' });
fig.part(gp, { name: 'Root filling', sub: 'gutta-percha', anchor: () => [DK.canalAt(s, 0, -12).x, -12, DK.canalAt(s, 0, -12).z], explode: [0, 0, 0], info: `Seals the cleaned canal to the apex. At least ${GP_SEAL_MIN} mm must stay apically after post-space preparation (articles quote 4–6 mm).`, when: (e, sec) => (sec && sec.enabled) || fig.xrayOn });
fig.part(post, { name: 'Fibre post', sub: 'glass fibre, bonded', anchor: [0.8, 2.5, 0], explode: [0, 9, 0], info: 'Only retains the core. A post does not strengthen the root; it is used when too little crown is left to hold a core.' });
fig.part(core, { name: 'Core', sub: 'composite build-up', anchor: [-2.6, 4, 0], explode: [0, 17, 0], info: 'Rebuilds the missing crown into a preparation shape the crown can sit on. (Tinted blue here for contrast; real composite is tooth-coloured.)' });
fig.part(crown, { name: 'Crown', sub: 'ceramic, full coverage', anchor: [-3.4, 6.5, 2.5], explode: [0, 26, 0], info: 'Covers the whole tooth and wraps the ferrule, holding everything together under biting forces.' });

fig.enableSection([0, 0, 1], [
  { objects: [bone.userData.layers.cortical], color: DK.COLORS.corticalCap },
  { objects: [bone.userData.layers.cancellous], color: 0xffffff, texture: bone.userData.layers.cancellous.userData.capTexture },
  { objects: [gum], color: DK.COLORS.gingivaCap },
  { objects: [crown], color: 0xf7f4ec },
  { objects: [tooth.layers.root, ferrule], color: DK.COLORS.dentinCap },
  { objects: [core], color: 0xbfc8ce },
  { objects: [gp], color: DK.COLORS.gutta },
  { objects: [post], color: 0xbfb9a6 }
]);
fig.standardControls({ section: { label: 'Cut', range: [-2.5, 2.5], offset: 0 } });

const seal = workingLen - POST_IN_ROOT - 0.2;
const ok = (v, min) => ({ v: DK.mm(v) + (v >= min ? ' ✓' : ' ⚠'), cls: v >= min ? 'ok' : 'warn' });
fig.setReadout([
  Object.assign({ k: 'Ferrule height (≥1.5)' }, ok(FERRULE, 1.5)),
  Object.assign({ k: `Apical seal (≥${GP_SEAL_MIN})` }, ok(seal, GP_SEAL_MIN))

// story (a short film): establishing shot → the layers lift as the camera orbits → push in on the post and core →
// reassemble and turn to the front as the cut sweeps in → the ferrule → push in on the apical seal
fig.story([
  { dur: 0, hold: 1.4, theta: 0.5, phi: 1.3, zoom: 1.05, labels: [], caption: 'A root-filled premolar, rebuilt with a post, a core and a crown.' },
  { dur: 2.4, hold: 2.2, theta: 0.85, phi: 1.2, explode: 0.8, labels: ['Crown', 'Core', 'Fibre post', 'Root filling'], caption: 'Four layers, lifted in the order they go in.' },
  { dur: 1.8, hold: 2.0, zoom: 0.55, focus: [0, 8, 0], labels: ['Fibre post', 'Core'], caption: 'The post only retains the core; it does not strengthen the root.' },
  { dur: 2.0, hold: 0.3, zoom: 1, focus: 'auto', theta: 0.05, phi: 1.45, explode: 0, labels: [] },
  { dur: 0, hold: 0, section: true, offset: 6 },
  { dur: 2.0, hold: 2.2, offset: 0, labels: ['Ferrule', 'Fibre post', 'Root filling'], caption: 'The 2 mm ferrule of own dentin, not the post, resists fracture.' },
  { dur: 1.8, hold: 2.6, zoom: 0.6, focus: [0, -10, 0], labels: ['Root filling'], caption: `${DK.mm(seal)} of root filling stays apically to keep the seal.` }
]);
fig.start();
