<body>
<script>window.DK_MODE = 'interactive'; window.DK_ASPECT = '16:9';</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* dentkit.js — drawing kit for interactive dental figures (three.js r128, global THREE).
   Units: millimetres. Tooth local frame: y up = coronal (CEJ at y=0), +x = mesial, +z = buccal/labial. */
(function () {
  const T = THREE;
  const DK = {};
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  DK.util = { clamp, lerp, smooth, ease };

  /* ---------- palette & materials ---------- */
  DK.COLORS = {
    enamel: 0xf2f0ea, enamelCap: 0xe9edf2, dentin: 0xe2c27e, dentinCap: 0xd9a95a,
    cementum: 0xdcc08a, pulp: 0xd9534f, pulpCap: 0xc0392b, nerve: 0xf2c94c, artery: 0xc0392b, vein: 0x3c6fb4,
    pdl: 0xb5566a, gingiva: 0xe58f9a, gingivaCap: 0xd46a78, cortical: 0xeee6d3, corticalCap: 0xe8dcc0,
    cancellous: 0xd8b98a, titanium: 0xa9adb3, titaniumDark: 0x7d828a, zirconia: 0xf6f3ec, ceramic: 0xf1ede2,
    gold: 0xd4a843, steel: 0xc3c7cc, nickelTi: 0x9aa0a6, gutta: 0xe07b39, composite: 0xf0e7d0, rubberDam: 0x2f80ed, caries: 0x6b4a2b
  };
  const MAT_PRESETS = {
    enamel: { color: 'enamel', roughness: 0.4, metalness: 0, clearcoat: 0.6 },
    dentin: { color: 'dentin', roughness: 0.6 },
    root: { color: 'cementum', roughness: 0.7 },
    pulp: { color: 'pulp', roughness: 0.5 },
    gingiva: { color: 'gingiva', roughness: 0.55 },
    bone: { color: 'cortical', roughness: 0.8 },
    titanium: { color: 'titanium', roughness: 0.32, metalness: 0.85 },
    titaniumDark: { color: 'titaniumDark', roughness: 0.35, metalness: 0.85 },
    gold: { color: 'gold', roughness: 0.3, metalness: 0.9 },
    steel: { color: 'steel', roughness: 0.25, metalness: 0.9 },
    zirconia: { color: 'zirconia', roughness: 0.3 },
    ceramic: { color: 'ceramic', roughness: 0.25, clearcoat: 0.8 },
    nerve: { color: 'nerve', roughness: 0.5 },
    artery: { color: 'artery', roughness: 0.45 },
    vein: { color: 'vein', roughness: 0.45 },
    pdl: { color: 'pdl', roughness: 0.6 },
    gutta: { color: 'gutta', roughness: 0.5 },
    composite: { color: 'composite', roughness: 0.35 },
    caries: { color: 'caries', roughness: 0.8 },
    rubberDam: { color: 'rubberDam', roughness: 0.5 },
    fiber: { color: 0xeeeadc, roughness: 0.35 },
    cement: { color: 0xd9e4ea, roughness: 0.6 }
  };
  DK.mat = function (name, extra) {
    const p = Object.assign({}, MAT_PRESETS[name] || { color: name }, extra || {});
    const c = typeof p.color === 'string' ? (DK.COLORS[p.color] !== undefined ? DK.COLORS[p.color] : p.color) : p.color;
    const Mat = p.clearcoat ? T.MeshPhysicalMaterial : T.MeshStandardMaterial;
    const m = new Mat({ color: c, roughness: p.roughness ?? 0.5, metalness: p.metalness ?? 0, ...(p.clearcoat ? { clearcoat: p.clearcoat, clearcoatRoughness: 0.35 } : {}), transparent: !!p.opacity && p.opacity < 1, opacity: p.opacity ?? 1, side: p.side ?? T.FrontSide, flatShading: !!p.flat });
    m.userData.capColor = p.cap !== undefined ? p.cap : c;
    return m;
  };

  /* ---------- geometry helpers ---------- */
  function gridGeometry(rows, cols, fn, closeTop, closeBottom) {
    // fn(i,j) -> [x,y,z]; rows along meridian (0..rows), cols around (0..cols-1, wraps)
    const pos = [], idx = [];
    for (let i = 0; i <= rows; i++) for (let j = 0; j < cols; j++) pos.push(...fn(i, j));
    const at = (i, j) => i * cols + (j % cols);
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
      idx.push(a, b, d, b, c, d);
    }
    const addCap = (row, pt, flip) => {
      const ci = pos.length / 3; pos.push(...pt);
      for (let j = 0; j < cols; j++) { const a = at(row, j), b = at(row, j + 1); flip ? idx.push(ci, b, a) : idx.push(ci, a, b); }
    };
    if (closeBottom) addCap(0, closeBottom, false);
    if (closeTop) addCap(rows, closeTop, true);
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  DK.gridGeometry = gridGeometry;
  const se = (v, n) => Math.sign(v) * Math.pow(Math.abs(v), 2 / n); // superellipse component

  DK.lathe = function (profile, segments, mat) { // profile: [[r,y],...] bottom→top
    const g = new T.LatheGeometry(profile.map(p => new T.Vector2(p[0], p[1])), segments || 48);
    g.computeVertexNormals();
    return mat ? new T.Mesh(g, mat) : g;
  };
  DK.tube = function (points, radius, mat, opts) {
    opts = opts || {};
    const curve = new T.CatmullRomCurve3(points.map(p => new T.Vector3(...p)));
    const g = new T.TubeGeometry(curve, opts.segments || 64, radius, opts.radial || 16, false);
    if (opts.taper) { // radius scale along length: taper(t)
      const pa = g.attributes.position, n = opts.segments || 64, r = opts.radial || 16, v = new T.Vector3();
      for (let i = 0; i <= n; i++) {
        const t = i / n, c = curve.getPointAt(t), s = opts.taper(t);
        for (let j = 0; j <= r; j++) { const k = i * (r + 1) + j; v.fromBufferAttribute(pa, k).sub(c).multiplyScalar(s).add(c); pa.setXYZ(k, v.x, v.y, v.z); }
      }
      g.computeVertexNormals();
    }
    const m = new T.Mesh(g, mat);
    if (opts.caps !== false) { // close ends with spheres so section caps work
      [0, 1].forEach(t => { const s = new T.Mesh(new T.SphereGeometry(radius * (opts.taper ? opts.taper(t) : 1), 16, 12), mat); s.position.copy(curve.getPointAt(t)); m.add(s); });
    }
    return m;
  };

  /* ---------- threaded bodies (implants, screws) ---------- */
  // Helical thread on a core. y from 0 (top) to -length.
  DK.threaded = function (o) {
    const L = o.length, rc = o.coreRadius, d = o.threadDepth, p = o.pitch, starts = o.starts || 1;
    const collar = o.collar ?? 0.8, apexTaper = o.apexTaper ?? 0.3, taper = o.bodyTaper ?? 0;
    const rows = o.rows || Math.ceil(L / p * 14), cols = o.cols || 72;
    const prof = u => { const f = u - Math.floor(u); return o.profile === 'square' ? (f < 0.5 ? 1 : 0.15) : (f < 0.5 ? f * 2 : (1 - f) * 2); };
    return gridGeometry(rows, cols, (i, j) => {
      const t = i / rows, y = -L * (1 - t), depthFromTop = L * (1 - t); // i=0 bottom (apex)
      const th = j / cols * Math.PI * 2;
      const apex = smooth(0, apexTaper * L, depthFromTop * 0 + (L - depthFromTop)); // 0 at apex → 1 above taper zone
      let core = (o.collarRadius && depthFromTop < collar) ? o.collarRadius : rc * (1 - taper * (depthFromTop / L));
      core *= lerp(0.55, 1, apex);
      const thread = depthFromTop < collar ? 0 : d * smooth(collar, collar + p, depthFromTop) * lerp(0.4, 1, apex);
      const r = core + thread * prof(depthFromTop / p * starts + th / (2 * Math.PI) * starts) - (o.round && t < 0.04 ? (0.04 - t) * 20 * core : 0);
      return [Math.cos(th) * Math.max(r, 0.02), y, Math.sin(th) * Math.max(r, 0.02)];
    }, [0, 0, 0], [0, -L - Math.min(rc * 0.25, 0.4), 0]);
  };

  /* ---------- teeth ---------- */
  // Crown surface: superellipse rings from cervix (y=0) to occlusal; relief(xn,zn) adds cusps/edges.
  function crownGeometry(c, inset, open) {
    inset = inset || { side: 0, top: 0, reliefScale: 1, topScale: 1 };
    const rows = 40, cols = 64, H = c.crownL - inset.top;
    const aC = c.mdC / 2 - inset.side * 0.4, bC = c.blC / 2 - inset.side * 0.4;
    const aM = c.md / 2 - inset.side, bM = c.bl / 2 - inset.side;
    const n = c.squareness || 2.4;
    return gridGeometry(rows, cols, (i, j) => {
      const t = i / rows, th = j / cols * Math.PI * 2;
      let a, b, y;
      const side = 0.72;
      if (t <= side) {
        const s = t / side, bul = Math.sin(Math.min(1, s / (c.contourAt || 0.75)) * Math.PI / 2);
        a = lerp(aC, aM, bul); b = lerp(bC, bM, Math.sin(Math.min(1, s / (c.blContourAt || 0.45)) * Math.PI / 2));
        if (c.incisal) b = lerp(b, c.incisalBL || 0.7, smooth(0.35, 1, s));
        y = s * H * (c.incisal ? 0.97 : 0.78);
      } else {
        const s = (t - side) / (1 - side);
        const k = Math.cos(s * Math.PI / 2);
        a = aM * (c.incisal ? lerp(1, 0.94, s) : k); b = (c.incisal ? lerp(c.incisalBL || 0.7, 0.05, s) : bM * k);
        y = c.incisal ? H * (0.97 + 0.03 * Math.sin(s * Math.PI / 2)) : H * (0.78 + 0.22 * Math.sin(s * Math.PI / 2) * (inset.topScale ?? 1));
      }
      a = Math.max(a, 0.05); b = Math.max(b, 0.03);
      const x = a * se(Math.cos(th), n), z = b * se(Math.sin(th), n);
      if (c.relief && !c.incisal) {
        const w = smooth(0.45, 0.95, t);
        y += w * c.relief(x / (c.md / 2), z / (c.bl / 2)) * (inset.reliefScale ?? 1);
      }
      if (c.incisal && c.incisalCurve) y += smooth(0.6, 1, t) * c.incisalCurve(x / (c.md / 2));
      return [x, y, z];
    }, null, open ? null : [0, 0, 0]);
  }
  DK.crownGeometry = crownGeometry;

  // Centre line of a root (or of a canal inside it) at depth y below the CEJ — shared by root, canal, PDL and helpers.
  function rootCenter(r, y) {
    const u = clamp(-y / r.len, 0, 1);
    return [r.x + (r.apex ? r.apex[0] : 0) * u * u + (r.flare ? r.flare[0] * Math.sin(u * Math.PI) : 0),
            r.z + (r.apex ? r.apex[1] : 0) * u * u + (r.flare ? r.flare[1] * Math.sin(u * Math.PI) : 0)];
  }
  function rootGeometry(r, scale) { // r: {x,z,len,ra,rb,apex:[dx,dz],start}; scale shrinks radii (canal / pdl)
    scale = scale || { k: 1, add: 0, minR: 0.05, endShort: 0 };
    const rows = 36, cols = 32, start = r.start ?? 0.6, L = r.len - (scale.endShort || 0);
    return gridGeometry(rows, cols, (i, j) => {
      const t = 1 - i / rows, th = j / cols * Math.PI * 2; // i=0 apex → i=rows top (outward normals)
      const tip = Math.sqrt(Math.max(0, 1 - Math.pow(t, r.tipSharp || 9)));
      const taper = (1 - (r.taper ?? 0.55) * Math.pow(t, 0.85)) * tip;
      const n = lerp(r.n0 || 2, 2, t);
      const ra = Math.max(r.ra * taper * scale.k + scale.add * tip, scale.minR * tip);
      const rb = Math.max(r.rb * taper * scale.k + scale.add * tip, scale.minR * tip);
      const y = start - t * (L + start);
      const [cx, cz] = rootCenter(r, y); // depends on depth only, so root, canal and PDL share one path
      return [cx + ra * se(Math.cos(th), n), y, cz + rb * se(Math.sin(th), n)];
    }, [r.x, (r.start ?? 0.6) + 0.01, r.z], null);
  }
  DK.rootGeometry = rootGeometry;

  // Occlusal relief from a cusp list [{x,z,h,w}] (normalized coords) + central fossa depth
  // grooves: [[x1,z1,x2,z2,depth?], ...] narrow valleys (central, buccal, lingual grooves) in normalized coords
  DK.cuspRelief = function (cusps, fossa, grooves) {
    const segD2 = (x, z, g) => { const dx = g[2] - g[0], dz = g[3] - g[1], L2 = dx * dx + dz * dz || 1e-6; const t = clamp(((x - g[0]) * dx + (z - g[1]) * dz) / L2, 0, 1); return (x - g[0] - t * dx) ** 2 + (z - g[1] - t * dz) ** 2; };
    return (xn, zn) => {
      let v = 0;
      cusps.forEach(c => { const d2 = (xn - c.x) ** 2 + (zn - c.z) ** 2; v += c.h * Math.exp(-d2 / (2 * (c.w || 0.26) ** 2)); });
      v = Math.min(v, Math.max(...cusps.map(c => c.h)) * 1.05);
      v -= (fossa || 0) * Math.exp(-(xn * xn + zn * zn) / 0.12);
      (grooves || []).forEach(g => { v -= (g[4] ?? 0.45) * Math.exp(-segD2(xn, zn, g) / 0.006); });
      return v;
    };
  };

  /* Tooth presets (Wheeler averages, mm). Local frame: +x mesial, +z facial, crown up. */
  const P = {};
  P.maxCentral = { name: 'Maxillary central incisor', crownL: 10.5, rootL: 13, md: 8.5, mdC: 7, bl: 7, blC: 6, incisal: true, incisalBL: 0.9, squareness: 2.6, contourAt: 0.85, blContourAt: 0.25,
    roots: [{ x: 0, z: 0, len: 13, ra: 3.3, rb: 2.9, taper: 0.62, apex: [-0.6, -0.4] }], canals: [{ root: 0, dx: 0, dz: 0, r: 0.55 }], pulpHorns: 3 };
  P.maxLateral = Object.assign({}, P.maxCentral, { name: 'Maxillary lateral incisor', crownL: 9, rootL: 13, md: 6.5, mdC: 5, bl: 6, blC: 5, roots: [{ x: 0, z: 0, len: 13, ra: 2.5, rb: 2.4, taper: 0.62, apex: [-1.0, -0.3] }] });
  P.maxCanine = { name: 'Maxillary canine', crownL: 10, rootL: 17, md: 7.5, mdC: 5.5, bl: 8, blC: 7, squareness: 2.1, contourAt: 0.7, blContourAt: 0.3,
    relief: DK.cuspRelief([{ x: 0, z: 0.05, h: 2.2, w: 0.42 }], 0), roots: [{ x: 0, z: 0, len: 17, ra: 2.7, rb: 3.4, taper: 0.62, apex: [-0.8, 0] }], canals: [{ root: 0, dx: 0, dz: 0, r: 0.6 }], coneTip: true };
  P.maxPM1 = { name: 'Maxillary first premolar', crownL: 8.5, rootL: 14, md: 7, mdC: 5, bl: 9, blC: 8, squareness: 2.3, contourAt: 0.7,
    relief: DK.cuspRelief([{ x: 0, z: 0.5, h: 2.2, w: 0.34 }, { x: 0, z: -0.5, h: 1.6, w: 0.32 }], 0.3, [[0.6, 0, -0.6, 0]]),
    roots: [{ x: 0, z: 1.9, len: 14, ra: 2.1, rb: 1.6, apex: [-0.5, 0.4], start: -0.5 }, { x: 0, z: -1.9, len: 13.5, ra: 2.0, rb: 1.5, apex: [-0.5, -0.4], start: -0.5 }],
    trunk: 4.5, canals: [{ root: 0, dx: 0, dz: 0, r: 0.4 }, { root: 1, dx: 0, dz: 0, r: 0.4 }] };
  P.maxPM2 = Object.assign({}, P.maxPM1, { name: 'Maxillary second premolar', relief: DK.cuspRelief([{ x: 0, z: 0.5, h: 1.8, w: 0.34 }, { x: 0, z: -0.5, h: 1.7, w: 0.32 }], 0.3, [[0.6, 0, -0.6, 0]]),
    roots: [{ x: 0, z: 0, len: 14, ra: 2.3, rb: 3.6, apex: [-0.6, 0] }], trunk: 0, canals: [{ root: 0, dx: 0, dz: 0, r: 0.45, rbk: 0.5 }] });
  P.maxM1 = { name: 'Maxillary first molar', crownL: 7.5, rootL: 13, md: 10, mdC: 8, bl: 11, blC: 10, squareness: 2.7, contourAt: 0.65,
    relief: DK.cuspRelief([{ x: 0.42, z: 0.48, h: 1.7 }, { x: -0.42, z: 0.48, h: 1.5 }, { x: 0.35, z: -0.42, h: 2.0, w: 0.34 }, { x: -0.48, z: -0.48, h: 1.3, w: 0.24 }, { x: 0.55, z: -0.8, h: 0.6, w: 0.15 }], 0.5, [[0.65, 0.05, -0.1, 0.1], [-0.1, 0.1, -0.55, -0.35], [-0.1, 0.1, -0.05, 0.85], [0.1, -0.05, 0.7, -0.6, 0.25]]),
    roots: [{ x: 2.2, z: 2.4, len: 12, ra: 1.9, rb: 2.7, taper: 0.5, apex: [-1.4, 0.6], flare: [0.4, 0.3], start: -0.5 }, { x: -2.4, z: 2.5, len: 11.5, ra: 1.75, rb: 1.9, taper: 0.5, apex: [-0.6, 0.6], flare: [-0.5, 0.3], start: -0.5 },
      { x: 0, z: -2.5, len: 13, ra: 2.4, rb: 2.2, taper: 0.5, apex: [0, -1.6], flare: [0, -0.8], start: -0.5 }],
    trunk: 4, canals: [{ root: 0, dx: -0.2, dz: 0.9, r: 0.38, name: 'MB1' }, { root: 0, dx: 0.15, dz: -0.95, r: 0.3, name: 'MB2', short: 1.5 }, { root: 1, dx: 0, dz: 0, r: 0.35, name: 'DB' }, { root: 2, dx: 0, dz: 0, r: 0.5, name: 'P' }] };
  P.mandCentral = { name: 'Mandibular central incisor', crownL: 9, rootL: 12.5, md: 5, mdC: 3.5, bl: 6, blC: 5.3, incisal: true, incisalBL: 0.8, squareness: 2.3, contourAt: 0.9, blContourAt: 0.2,
    roots: [{ x: 0, z: 0, len: 12.5, ra: 1.75, rb: 2.6, taper: 0.62, apex: [-0.3, 0] }], canals: [{ root: 0, dx: 0, dz: 0, r: 0.38, rbk: 0.7 }] };
  P.mandLateral = Object.assign({}, P.mandCentral, { name: 'Mandibular lateral incisor', crownL: 9.5, rootL: 14, md: 5.5, mdC: 4, bl: 6.5, blC: 5.8, roots: [{ x: 0, z: 0, len: 14, ra: 1.95, rb: 2.9, taper: 0.62, apex: [-0.5, 0] }] });
  P.mandCanine = Object.assign({}, P.maxCanine, { name: 'Mandibular canine', crownL: 11, rootL: 16, md: 7, mdC: 5.5, bl: 7.5, blC: 7, roots: [{ x: 0, z: 0, len: 16, ra: 2.6, rb: 3.4, taper: 0.62, apex: [-0.4, 0] }] });
  P.mandPM1 = { name: 'Mandibular first premolar', crownL: 8.5, rootL: 14, md: 7, mdC: 5, bl: 7.5, blC: 6.5, squareness: 2.2, contourAt: 0.7,
    relief: DK.cuspRelief([{ x: 0, z: 0.35, h: 2.4, w: 0.42 }, { x: 0, z: -0.6, h: 0.7, w: 0.3 }], 0.2),
    roots: [{ x: 0, z: 0, len: 14, ra: 2.3, rb: 3.0, apex: [-0.6, 0] }], canals: [{ root: 0, dx: 0, dz: 0, r: 0.45 }] };
  P.mandPM2 = Object.assign({}, P.mandPM1, { name: 'Mandibular second premolar', crownL: 8, rootL: 14.5, bl: 8, blC: 7,
    relief: DK.cuspRelief([{ x: 0, z: 0.35, h: 1.9, w: 0.4 }, { x: 0.3, z: -0.5, h: 1.3, w: 0.28 }, { x: -0.3, z: -0.5, h: 1.1, w: 0.26 }], 0.4),
    roots: [{ x: 0, z: 0, len: 14.5, ra: 2.4, rb: 3.2, apex: [-0.6, 0] }] });
  P.mandM1 = { name: 'Mandibular first molar', crownL: 7.5, rootL: 14, md: 11, mdC: 9, bl: 10.5, blC: 9, squareness: 2.7, contourAt: 0.7,
    relief: DK.cuspRelief([{ x: 0.5, z: 0.45, h: 1.5 }, { x: -0.05, z: 0.5, h: 1.4 }, { x: -0.62, z: 0.3, h: 1.1, w: 0.22 }, { x: 0.45, z: -0.45, h: 1.9 }, { x: -0.38, z: -0.45, h: 1.8 }], 0.45, [[0.75, 0, -0.75, 0.02], [0.22, 0, 0.25, 0.9], [-0.35, 0.02, -0.4, 0.85], [0.05, 0, 0.05, -0.9]]),
    roots: [{ x: 2.25, z: 0, len: 14, ra: 1.85, rb: 3.7, apex: [-1.4, 0], start: -0.5 }, { x: -2.3, z: 0, len: 13, ra: 1.85, rb: 3.4, apex: [-0.9, 0], start: -0.5 }],
    trunk: 3, canals: [{ root: 0, dx: 0, dz: 1.5, r: 0.35, name: 'MB' }, { root: 0, dx: 0, dz: -1.5, r: 0.35, name: 'ML' }, { root: 1, dx: 0, dz: 0, r: 0.38, rbk: 1.6, name: 'D' }] };
  P.mandM2 = Object.assign({}, P.mandM1, { name: 'Mandibular second molar', crownL: 7, rootL: 13, md: 10.5, mdC: 8, bl: 10, blC: 9,
    relief: DK.cuspRelief([{ x: 0.45, z: 0.45, h: 1.4 }, { x: -0.45, z: 0.45, h: 1.3 }, { x: 0.45, z: -0.45, h: 1.7 }, { x: -0.45, z: -0.45, h: 1.6 }], 0.45, [[0.75, 0, -0.75, 0], [0, 0, 0, 0.9], [0, 0, 0, -0.9]]),
    roots: [{ x: 1.95, z: 0, len: 13, ra: 1.75, rb: 3.5, apex: [-1.6, 0], start: -0.5 }, { x: -2.0, z: 0, len: 12.5, ra: 1.75, rb: 3.3, apex: [-1.3, 0], start: -0.5 }] });
  P.maxM2 = Object.assign({}, P.maxM1, { name: 'Maxillary second molar', crownL: 7, md: 9, mdC: 7, bl: 11, blC: 10 });
  DK.PRESETS = P;
  const POS = { 1: 'Central', 2: 'Lateral', 3: 'Canine', 4: 'PM1', 5: 'PM2', 6: 'M1', 7: 'M2', 8: 'M2' };
  // FDI two-digit → preset (permanent teeth only). Third molars approximated by second molars (flagged).

    const m = DK.lathe([[0, -o.length - 0.2], [o.d1 / 2 * 0.8, -o.length - 0.1], [o.d1 / 2, -o.length + 0.2], [o.d0 / 2, 0], [o.d0 / 2, o.exposed - 0.3], [o.d0 / 2 - 0.3, o.exposed], [0, o.exposed]], 32, DK.mat(o.material));
    m.name = 'Post'; return m;
  };
  // Root filling along a canal, from `from` (y) to working length. Closed solid (section-ready). which: canal name or index.
  DK.guttaPercha = function (spec, which, o) {
    o = o || {}; const c = findCanal(spec, which), pts = DK.canalPath(spec, which, o);
    const y0 = pts[0][1], y1 = pts[pts.length - 1][1];
    const rAt = y => DK.canalAt(spec, which, y).r * 0.92;
    const m = DK.tube(pts, 1, DK.mat('gutta'), { taper: t => rAt(lerp(y0, y1, t)), radial: 14 });
    m.name = 'Root filling'; return m;
  };
  // Distance helper for readouts
  DK.mm = v => (Math.round(v * 10) / 10).toFixed(1) + ' mm';

  window.DK = DK;
})();

</script>
<script>
// Example procedure: placing a single implant in the healed site of the mandibular left first molar (FDI 36 = Universal 19),
// seen in a mesio-distal cut so the neighbouring roots and the inferior alveolar canal stay visible.
// Tools and parts that the steps move are added to fig.world and annotated with inPlace: true (explode would reset them).
// Frame: +x = mesial, +z = buccal, y up. Neighbour CEJs at y = 0. All sizes in mm.
const CREST = -1.8;                                  // alveolar crest
const IMPLANT = { diameter: 4.1, length: 10, lead: 1.6 };   // lead = advance per turn (0.8 mm pitch, 2 starts)
const CANAL_Y = CREST - IMPLANT.length - 4.0, CANAL_R = 1.5;
const PILOT = 2.0, FINAL = 3.5;                      // drill diameters; the final size is set by the implant system
const clearance = (CREST - IMPLANT.length) - (CANAL_Y + CANAL_R);

const fig = DK.figure({
  title: 'Placing an implant in 36',
  subtitle: 'FDI 36 (Universal 19), mesio-distal cut. Drill sizes vary by system.',
  view: { theta: 0, phi: 1.45 }
});

// --- context: bone, canal, gingiva, neighbours (regular parts: they frame the camera)
const bone = DK.bone({ width: 34, height: 19, depth: 11, cortical: 1.2, crest: 1.6 });
bone.position.set(-1, CREST, 0);
const canal = new THREE.Group();
const path = [[-18, CANAL_Y - 0.6, 0.4], [-6, CANAL_Y, 0.2], [6, CANAL_Y + 0.3, 0], [16, CANAL_Y + 0.9, -0.2]];
const lumen = DK.tube(path, CANAL_R, DK.mat('pdl', { color: 0xf0dcc4, cap: 0xf0dcc4 }), { caps: false });
const nerve = DK.tube(path.map(p => [p[0], p[1] - 0.2, p[2] - 0.1]), 0.75, DK.mat('nerve'), { caps: false });
canal.add(lumen, nerve);
const gum = DK.gingiva({ width: 34, height: 3.4, depth: 11.6, crest: 1.4 });
gum.position.set(-1, 1.1, 0);
const t35 = DK.tooth(35); t35.group.position.x = 5.5 + 3.5;
const t37 = DK.tooth(37); t37.group.position.x = -(5.5 + 5.25);

fig.part(bone, { name: 'Bone', label: false, info: 'Healed alveolar ridge: cortical shell over cancellous bone.' });
fig.part(canal, { name: 'Inferior alveolar canal', sub: `${clearance.toFixed(1)} mm below the implant`, anchor: [-13, CANAL_Y - 0.5, 0], info: 'Keep at least 2 mm between the implant apex and the canal.' });
fig.part(gum, { name: 'Gingiva', label: false, info: 'Soft tissue over the ridge.' });
fig.part(t35.group, { name: '35', anchor: [0, 6, 0], info: 'Lower second premolar. Keep at least 1.5 mm from its root.' });
fig.part(t37.group, { name: '37', anchor: [0, 6, 0], info: 'Lower second molar. Keep at least 1.5 mm from its mesial root.' });

// --- what the procedure moves (inPlace parts, positioned by params)
const hole1 = DK.osteotomy(), hole2 = DK.osteotomy();
hole1.position.y = hole2.position.y = CREST + 0.02;
const pilot = DK.drill({ diameter: PILOT, length: 14, shank: 6 });
const final = DK.drill({ diameter: FINAL, length: 14, shank: 6 });
const implant = DK.implant({ diameter: IMPLANT.diameter, length: IMPLANT.length, connection: 'internal hex' });
const heal = DK.lathe([[0, 0], [2.05, 0], [2.3, 2.2], [2.3, 3.4], [2.0, 3.6], [0, 3.6]], 48, DK.mat('titanium'));
const abut = DK.abutment({ platform: 4.1, collarHeight: 2.0, postHeight: 3.5, emergence: 5.6 });
const crown = DK.restorationCrown(36, 'zirconia', { hollow: false });
[hole1, hole2, pilot, final, implant, heal, abut, crown].forEach(o => fig.world.add(o));

fig.part(pilot, { inPlace: true, name: 'Pilot drill', sub: `Ø${PILOT} mm`, anchor: [0, -6, 0], info: 'First drill: sets the position, angle and depth of the implant bed.' });
fig.part(final, { inPlace: true, name: 'Final drill', sub: `Ø${FINAL} mm (system-specific)`, anchor: [0, -6, 0], info: 'Sequential drills widen the bed; the final size depends on the implant system and bone density.' });
fig.part(implant, { inPlace: true, name: 'Implant', sub: `Ø${IMPLANT.diameter} × ${IMPLANT.length} mm`, anchor: [IMPLANT.diameter / 2, -5, 0], info: 'Threaded in to the depth of the bed.' });
fig.part(heal, { inPlace: true, name: 'Healing abutment', anchor: [2.3, 2, 0], info: 'Shapes the gingiva while the implant integrates.' });
fig.part(abut, { inPlace: true, name: 'Abutment', anchor: [2.8, 1.2, 0], info: 'Connects the crown to the implant; the hex stops it rotating.' });
fig.part(crown, { inPlace: true, name: 'Crown', sub: 'zirconia', anchor: [-3, 6.5, 0], info: 'Restores the occlusion of 36.' });

// --- params: every moving thing is a number the steps animate
const drillAt = (tool, d) => { tool.visible = d > -15; tool.position.y = CREST - d + 14; tool.rotation.y = d * 3; };  // d = tip depth below crest
fig.param('pilot', -20, d => drillAt(pilot, d));
fig.param('final', -20, d => drillAt(final, d));
fig.param('bed1', 0, d => hole1.set(PILOT / 2, d));
fig.param('bed2', 0, d => hole2.set(FINAL / 2, d));
fig.param('implant', 0, k => {   // 0 = hovering 3 mm above the crest, 1 = seated at the crest
  const travel = (1 - k) * (IMPLANT.length + 3);
  implant.visible = k > 0.001; implant.position.y = CREST + travel; implant.rotation.y = -travel / IMPLANT.lead * Math.PI * 2;
});
fig.param('heal', 0, k => { heal.visible = k > 0.001; heal.position.y = CREST + (1 - k) * 8; });
fig.param('crown', 0, k => {
  abut.visible = crown.visible = k > 0.001;
  abut.position.y = CREST + (1 - k) * 10; crown.position.y = 0.2 + (1 - k) * 18;
});

fig.enableSection([0, 0, 1], [
  { objects: [bone.userData.layers.cortical], color: DK.COLORS.corticalCap },
  { objects: [bone.userData.layers.cancellous], color: 0xffffff, texture: bone.userData.layers.cancellous.userData.capTexture },
  { objects: [lumen], color: 0xf0dcc4 }, { objects: [nerve], color: DK.COLORS.nerve },
  { objects: [gum], color: DK.COLORS.gingivaCap },
  { objects: [hole2], color: 0x5b2a25 }, { objects: [hole1], color: 0x5b2a25 },
  { objects: [t35.layers.enamel, t37.layers.enamel], color: DK.COLORS.enamelCap },
  { objects: [t35.layers.root, t35.layers.dentin, t37.layers.root, t37.layers.dentin], color: DK.COLORS.dentinCap },
  { objects: [t35.layers.pulp, t37.layers.pulp], color: DK.COLORS.pulpCap }
]);
fig.standardControls({ explode: false, section: { label: 'Cut', on: true, range: [-4, 4], offset: 0 } });

const D = IMPLANT.length;
fig.procedure([
  { label: 'Healed site', caption: 'The healed site of 36, between 35 and 37.', beats: [
    { dur: 0, hold: 1.6, section: true, offset: 0, labels: ['35', '37', 'Inferior alveolar canal'] }] },
  { label: 'Pilot drill', caption: `Pilot drill to ${D} mm: position, angle, depth.`, beats: [
    { dur: 1.0, hold: 0.2, zoom: 0.9, set: { pilot: 0 }, labels: ['Pilot drill'] },
    { dur: 1.8, hold: 0.6, set: { pilot: D, bed1: D }, labels: ['Pilot drill', 'Inferior alveolar canal'], key: true },
    { dur: 0.9, hold: 0.2, set: { pilot: -20 }, labels: [] }] },
  { label: 'Final drill', caption: 'Wider drills shape the bed to the implant.', beats: [
    { dur: 1.0, hold: 0.2, set: { final: 0 }, labels: ['Final drill'] },
    { dur: 1.8, hold: 0.6, set: { final: D, bed2: D }, key: true },
    { dur: 0.9, hold: 0.2, set: { final: -20 }, labels: [] }] },
  { label: 'Implant', caption: `Implant threaded in, ${clearance.toFixed(1)} mm above the canal.`, beats: [
    { dur: 0.8, hold: 0.1, set: { implant: 0.05 }, labels: ['Implant'] },
    { dur: 2.6, hold: 1.4, set: { implant: 1 }, labels: ['Implant', 'Inferior alveolar canal'] }] },
  { label: 'Healing', caption: 'Healing abutment: 3–6 months to integrate.', beats: [
    { dur: 1.0, hold: 1.8, set: { heal: 1 }, labels: ['Healing abutment'] }] },
  { label: 'Crown', caption: 'Abutment and crown restore the tooth.', beats: [
    { dur: 0.6, hold: 0.1, set: { heal: 0 }, labels: [] },
    { dur: 1.6, hold: 2.2, zoom: 1, set: { crown: 1 }, labels: ['Abutment', 'Crown', 'Implant'] }] }
]);
fig.start();

</script>
