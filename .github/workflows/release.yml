name: Release

# Push a tag like v1.3.0 to publish a release. The tag must match the version in
# plugin.json and .claude-plugin/plugin.json. The release gets both ZIPs from scripts/package.py.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the plugin version
        run: |
          v=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match plugin version $v"; exit 1; }
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Test
        run: python scripts/test.py --soft --out test-output
      - name: Package
        run: python scripts/package.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/dental-explainer.zip dist/dental-explainer-plugin.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/dental-explainer.zip dist/dental-explainer-plugin.zip \
              --title "dental-explainer ${GITHUB_REF_NAME#v}" --generate-notes
          fi
