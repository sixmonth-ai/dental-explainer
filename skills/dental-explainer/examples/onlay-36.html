<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onlay on a lower first molar</title></head>
<body>
<script>window.DK_MODE = 'interactive'; window.DK_ASPECT = '16:9';</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* dentkit.js — drawing kit for interactive dental figures (three.js r128, global THREE).
   Units: millimetres. Tooth local frame: y up = coronal (CEJ at y=0), +x = mesial, +z = buccal/labial. */
(function () {
  const T = THREE;
  const DK = {};
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  DK.util = { clamp, lerp, smooth, ease };

  // everything out on an sRGB canvas. DK.color converts. Use it for any custom material colour.
  DK.color = hex => new T.Color(hex).convertSRGBToLinear();

  /* ---------- palette & materials ---------- */
  // Restrained palette: every tissue is a muted ivory, grey or dusty tone from the off-white / ink world of the brand, so the
  // figure reads as one calm object; the brand accent is reserved for the single thing a figure points at.
  DK.COLORS = {
    enamel: 0xeeeae2, enamelCap: 0xe8e6df, dentin: 0xcfba96, dentinCap: 0xccb894,
    cementum: 0xb0a287, pulp: 0xa16f69, pulpCap: 0xa16f69, nerve: 0xc6b183, artery: 0xa36f68, vein: 0x7e8793,
    pdl: 0x9e8983, gingiva: 0xb78b87, gingivaCap: 0xaf817d, mucosa: 0xa37c79, mucosaCap: 0x9c7471,
    gingivaInflamed: 0xac7773, gingivaInflamedCap: 0xa4706c,
    cortical: 0xcfc5b0, corticalCap: 0xd9d0bd, cancellous: 0xb9a88c, trabecula: 0xddd4c0, marrow: 0xbfae92,
    titanium: 0x929a9c, titaniumDark: 0x656e72, zirconia: 0xf5f3ee, zirconiaCap: 0xe8e8e1, ceramic: 0xdddcd3, ceramicCap: 0xe2dfd5,
    gold: 0xb6a17b, steel: 0xd2d6d5, nickelTi: 0x8d9692, gutta: 0xb58268,
    composite: 0xe6dcc4, compositeCap: 0xdccfb1, compositeLight: 0xefe6d2,   // tooth-coloured ivory, a step off dentin; amalgam stays grey fiber: 0xd2cec0, fiberCap: 0xb6b2a4,
    cement: 0xc6c9c5, rubberDam: 0x737f82, caries: 0x7a6554, cavity: 0xd3ccbe, cavityDark: 0x262521,   // empty space: a recessed shade of the stage, never caries brown or amalgam grey
    accent: 0x0E3A5C, accentDark: 0x5A8FB8

    enamel: { color: 'enamel', cap: 'enamelCap', roughness: 0.34, metalness: 0, clearcoat: 0.38, clearcoatRoughness: 0.32, envMapIntensity: 0.65, rim: [0.86, 0.89, 0.91, 0.16], core: [1.0, 0.975, 0.93, 0.24], bump: 'perikymata', bumpScale: 0.005 },
    dentin: { color: 'dentin', cap: 'dentinCap', roughness: 0.68, envMapIntensity: 0.5, bump: 'streaks', bumpScale: 0.016 },
    root: { color: 'cementum', cap: 'dentinCap', roughness: 0.76, envMapIntensity: 0.45, bump: 'streaks', bumpScale: 0.024, map: 'streaks' },
    pulp: { color: 'pulp', roughness: 0.5 },
    gingiva: { color: 'gingiva', cap: 'gingivaCap', roughness: 0.52, clearcoat: 0.18, envMapIntensity: 0.55, bump: 'stipple', bumpScale: 0.014, core: [1.0, 0.95, 0.94, 0.15] },

    bone: { color: 'cortical', cap: 'corticalCap', roughness: 0.84, envMapIntensity: 0.4, bump: 'pores', bumpScale: 0.035, map: 'pores' },
    titanium: { color: 'titanium', roughness: 0.42, metalness: 0.82 },
    titaniumDark: { color: 'titaniumDark', roughness: 0.46, metalness: 0.8 },
    gold: { color: 'gold', roughness: 0.3, metalness: 0.9 },
    steel: { color: 'steel', roughness: 0.23, metalness: 0.93 },

    artery: { color: 'artery', roughness: 0.45 },
    vein: { color: 'vein', roughness: 0.45 },
    pdl: { color: 'pdl', roughness: 0.6 },
    gutta: { color: 'gutta', roughness: 0.63, envMapIntensity: 0.5 },
    composite: { color: 'composite', cap: 'compositeCap', roughness: 0.42, clearcoat: 0.16, envMapIntensity: 0.55 },
    caries: { color: 'caries', roughness: 0.8 },

  const N8 = v => Math.round(clamp(v, 0, 1) * 255);

    if (TEX[kind]) return TEX[kind];

      const f = noiseField(N, 24, 24, seeded(11), 3, 0.55), c = noiseField(N, 4, 4, seeded(12), 2), rnd = seeded(13);
      const dots = new Float32Array(N * N); for (let k = 0; k < 420; k++) { const x0 = rnd() * N, y0 = rnd() * N, r = 1 + rnd() * 2.2; for (let y = -3; y <= 3; y++) for (let x = -3; x <= 3; x++) { const d = Math.hypot(x, y) / r; if (d < 1) { const X = ((Math.round(x0) + x) % N + N) % N, Y = ((Math.round(y0) + y) % N + N) % N; dots[Y * N + X] = Math.max(dots[Y * N + X], 1 - d * d); } } }
      t = dataTexture(N, (i, px) => { const v = 0.5 + (f[i] - 0.5) * 0.5 + (c[i] - 0.5) * 0.5 - dots[i] * 0.45; px[0] = px[1] = px[2] = N8(v); }, { repeat: [3, 3] });

      const f = noiseField(N, 48, 3, seeded(21), 2, 0.5), c = noiseField(N, 6, 6, seeded(22), 2);
      t = dataTexture(N, (i, px) => { const v = 0.5 + (f[i] - 0.5) * 0.7 + (c[i] - 0.5) * 0.4; px[0] = px[1] = px[2] = N8(v); }, { repeat: [3, 1] });

    const Mat = p.clearcoat ? T.MeshPhysicalMaterial : T.MeshStandardMaterial;
    const m = new Mat({ color: DK.color(c), roughness: p.roughness ?? 0.5, metalness: p.metalness ?? 0, envMapIntensity: p.envMapIntensity ?? 0.8, ...(p.clearcoat ? { clearcoat: p.clearcoat, clearcoatRoughness: p.clearcoatRoughness ?? 0.4 } : {}),
      ...(p.bump ? { bumpMap: noiseTexture(p.bump), bumpScale: p.bumpScale ?? 0.03 } : {}), ...(p.map ? { map: mapTexture(p.map) } : {}),
      transparent: p.opacity !== undefined && p.opacity < 1, opacity: p.opacity ?? 1, side: p.side ?? T.FrontSide, flatShading: !!p.flat });

      const rootColor = DK.color(DK.COLORS.cementum).toArray().map(x => x.toFixed(6)).join(',');

        (p.rim ? `{ vec4 R = vec4(${v4(p.rim)}); diffuseColor.rgb *= mix(vec3(1.0), R.rgb, pow(fr, 2.5) * R.a); }` : '') +
        (p.core ? `{ vec4 C = vec4(${v4(p.core)}); diffuseColor.rgb *= mix(vec3(1.0), C.rgb, pow(1.0 - fr, 1.5) * C.a); }` : '');

          sh.vertexShader = 'varying float vDKToothY;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvDKToothY = position.y;');
          sh.fragmentShader = 'varying float vDKToothY;\n' + sh.fragmentShader;
        }
        sh.fragmentShader = sh.fragmentShader.replace('#include <lights_physical_fragment>',
          `{ float fr = 1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0); ${code} }\n#include <lights_physical_fragment>`);
      };

    }

  };

  /* ---------- geometry helpers ---------- */
  function gridGeometry(rows, cols, fn, closeTop, closeBottom) {

    // so the surface carries seamless UVs (u around, v along); the seam normals are averaged afterwards.
    const pos = [], uv = [], idx = [], W = cols + 1;
    for (let i = 0; i <= rows; i++) for (let j = 0; j <= cols; j++) { pos.push(...fn(i, j % cols)); uv.push(j / cols, i / rows); }
    const at = (i, j) => i * W + j;

      const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);

      const ci = pos.length / 3; pos.push(...pt); uv.push(0.5, row ? 1 : 0);
      for (let j = 0; j < cols; j++) { const a = at(row, j), b = at(row, j + 1); flip ? idx.push(ci, b, a) : idx.push(ci, a, b); }

  /* ---------- threaded bodies (implants, screws) ---------- */
  // Helical thread on a core. y from 0 (top) to -length.

<script>
// Example: a lithium-disilicate onlay on the mandibular left first molar (FDI 36 = Universal 19): an MOD cavity with the two
// buccal cusps covered. The onlay lifts off the prep on explode; a bucco-lingual cut through the central fossa shows the isthmus

const fig = DK.figure({
  fov: 32,
  title: 'Onlay on a lower first molar',
  subtitle: 'FDI 36 (Universal 19). MOD cavity, buccal cusps covered. Lithium disilicate.',
  view: { theta: 0.55, phi: 1.2 }
